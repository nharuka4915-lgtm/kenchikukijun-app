<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宅建・暗記アプリ</title>
<style>
    body { 
        font-family: 'Hiragino Sans', 'Meiryo', sans-serif; 
        background-color: #f4f7f6; 
        color: #333; 
        padding: 20px; 
        line-height: 1.6;
    }
    .container {

        background: #2c3e50; 
        color: #fff; 
        padding: 15px 20px; 
        gap: 10px;
    }
    .header h2 { margin: 0; font-size: 18px; font-weight: normal; flex-grow: 1; }
    .badge-category { 
        background: #3498db; 
        padding: 6px 12px; 
        border-radius: 4px; 
        font-size: 14px; 
        font-weight: bold;
    }
    .badge-subcategory { 
        background: #e67e22; 
        padding: 6px 12px; 
        border-radius: 4px; 
        font-size: 14px; 
        font-weight: bold;
    }
    .score-board {
        font-size: 14px;
        background: rgba(255,255,255,0.1);
        padding: 6px 12px;
        border-radius: 4px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }
    th, td {
        border: 1px solid #ddd;
        padding: 15px;
        vertical-align: top;
    }
    th {
        background: #ecf0f1;
        text-align: center;
        font-weight: bold;
        color: #333;
    }
    .item-group {
        margin-bottom: 12px;
    }
    .item-group:last-child {
        margin-bottom: 0;
    }

        background-color: #2c3e50; 
        color: #2c3e50; 
        cursor: pointer; 
        border-radius: 4px; 
        padding: 2px 6px; 
        user-select: none; 
        transition: all 0.2s; 
        font-weight: bold;
        display: inline-block;
    }
    .hidden-text.revealed { 
        background-color: #ffe6e6; 
        color: #e74c3c; 
    }
    .hidden-text.auto-revealed {
        background-color: #e8f8f5;
        color: #16a085;
        border: 1px dashed #1abc9c;
    }

        padding: 10px 24px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
        transition: opacity 0.2s;
    }

    .button-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        align-items: center;
    }
    .btn-prev { background-color: #95a5a6; color: white; }
    .btn-next { background-color: #3498db; color: white; }
    .btn-correct { background-color: #2ecc71; color: white; }
    .btn-start { background-color: #3498db; color: white; font-size: 18px; padding: 12px 30px; }
    
    .instruction { 
        text-align: center; 
        margin-bottom: 20px; 
        color: #666; 
        font-size: 0.95em;

    .mode-select-box {
        padding: 50px 20px;
        text-align: center;
    }

        color: #2c3e50;
        margin-bottom: 10px;
    }
    .mode-select-box p {
        color: #666;
        margin-bottom: 30px;
    }
    .radio-group {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin-bottom: 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;

    .radio-group label {
        cursor: pointer;

</style>
</head>
<body>
<div class="instruction">
    <p>💡 黒塗り部分をタップして答えを確認し、すべて開いたら「次の問題へ」を押そう！（前の問題に戻ることもできます）</p>
</div>

<div class="container" id="app-container">
    <!-- 初期状態：モード選択画面 -->
    <div class="mode-select-box">
        <h1>宅建・暗記トレーニング</h1>
        <p>出題方法を選んで「スタート」を押してください。</p>
        
        <div class="radio-group">
            <label><input type="radio" name="playMode" value="normal" checked> 順番通り</label>
            <label><input type="radio" name="playMode" value="random"> ランダム</label>
        </div>
        
        <button class="btn btn-start" onclick="startApp()">スタート！</button>
    </div>
</div>

<script>
    const rawQuestions = [
        {
            category: "単体規定",
            subcategory: "① 主要構造部",
            title: "主要構造部・防火構造等",
            headers: `<tr><th style="width: 40%;">対象の建築物 </th><th style="width: 60%;">適合すべき基準</th></tr>`,
            rows: [
                `<tr>
                    <td class="col-d">
                        <div class="item-group">① 4階建て以上（地階を<span class="hidden-text" onclick="reveal(this)">除く</span>）</div>
                        <div class="item-group">② 高さが<span class="hidden-text" onclick="reveal(this)">16m超</span></div>
                        <div class="item-group">③ 倉庫・自動車車庫等で高さが<span class="hidden-text" onclick="reveal(this)">13m超</span></div>
                    </td>
                    <td class="col-e">
                        <div class="item-group">特定主要構造部を通常火災終了時間が経過するまでの間、その火災による倒壊・延焼を防止するための一定の技術的基準に適合し、国土交通大臣が定めた構造方法を用いるもの等とする</div>
                        <div class="item-group" style="margin-top: 10px;">
                            ただし、その周囲に一定の基準に適合した延焼防止上有効な<span class="hidden-text" onclick="reveal(this)">空き地</span>がある場合は除く
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="col-d">
                        延べ面積が<span class="hidden-text" onclick="reveal(this)">3,000㎡超</span>の建築物
                    </td>
                    <td class="col-e">
                        <span class="hidden-text" onclick="reveal(this)">壁</span>、<span class="hidden-text" onclick="reveal(this)">柱</span>、<span class="hidden-text" onclick="reveal(this)">床</span>その他の建築物の部分、または<span class="hidden-text" onclick="reveal(this)">防火戸</span>その他の政令で定める<span class="hidden-text" onclick="reveal(this)">防火設備</span>を、通常の火災時における火熱が当該建築物の周囲に防火上有害な影響を及ぼすことを防止するための一定の技術的基準に適合し、国土交通大臣が定めた構造方法を用いるもの等とする
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="background: #fdfefe; font-size: 0.95em; color: #555;">
                        ※これらの基準の適用上、一の建築物であっても、<span class="hidden-text" onclick="reveal(this)">火熱遮断壁</span>等で区画すれば、それぞれ別の建築物とみなされる
                    </td>
                </tr>`
            ]
        },
        {
            category: "単体規定",
            subcategory: "② 防火・避難",
            title: "防火・避難に関する基準",
            headers: `<tr><th style="width: 40%;">対象の建築物</th><th style="width: 60%;">適合すべき基準</th></tr>`,
            rows: [
                `<tr>
                    <td class="col-d">

                    </td>
                    <td class="col-e">
                        <span class="hidden-text" onclick="reveal(this)">外壁</span>、<span class="hidden-text" onclick="reveal(this)">軒裏</span>で延焼のおそれがある部分を<span class="hidden-text" onclick="reveal(this)">防火構造</span>とし、<span class="hidden-text" onclick="reveal(this)">屋根</span>の構造を火災に関する性能について一定の技術的基準に適合するもの<br>
                        で、<span class="hidden-text" onclick="reveal(this)">国土交通大臣</span>の認定を受けたもの等にしなければならない
                    </td>
                </tr>
                <tr>
                    <td class="col-d">

            ]

        {

                    </td>

                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="background: #fdfefe; font-size: 0.95em; color: #555;">
                        ※住宅の居室、割合が1/5や1/7とされた居室に関しては、<span class="hidden-text" onclick="reveal(this)">国土交通大臣</span>が定める基準に従い、<span class="hidden-text" onclick="reveal(this)">照明設備</span>の設置、<span class="hidden-text" onclick="reveal(this)">有効な採光方法の確保</span>その他これらに準ずる措置が講じられていれば、それぞれ<span class="hidden-text" onclick="reveal(this)">1/10</span>までの範囲内において<span class="hidden-text" onclick="reveal(this)">国土交通大臣</span>が別に定める割合となる
                    </td>
                </tr>
                <tr>
                    <td class="col-d">
                        住宅の居室、学校の教室、病院の病室など
                    </td>
                    <td class="col-e">
                        <span class="hidden-text" onclick="reveal(this)">地階</span>に設けるものは<span class="hidden-text" onclick="reveal(this)">壁</span>および<span class="hidden-text" onclick="reveal(this)">床</span>の<span class="hidden-text" onclick="reveal(this)">防湿</span>の措置その他の事項において衛生上必要な政令で定める技術的基準に適合するものでなければならない
                    </td>
                </tr>`
            ]
        },
        {
            category: "集団規定",
            subcategory: "適用範囲",
            title: "集団規定の適用範囲",
            headers: `<tr><th style="width: 40%;">原則</th><th style="width: 60%;">例外</th></tr>`,
            rows: [
                `<tr>
                    <td class="col-d">
                        <span class="hidden-text" onclick="reveal(this)">都市計画区域</span>および<span class="hidden-text" onclick="reveal(this)">準都市計画区域</span><b>内</b>
                    </td>
                    <td class="col-e">
                        <span class="hidden-text" onclick="reveal(this)">都市計画区域</span>および<span class="hidden-text" onclick="reveal(this)">準都市計画区域</span><b>外</b>であっても、<span class="hidden-text" onclick="reveal(this)">都道府県知事</span>が関係市町村の意見を聴いて指定する区域内においては、地方公共団体は、条例で、一定の事項（<span class="hidden-text" onclick="reveal(this)">道路</span>に関する制限、<span class="hidden-text" onclick="reveal(this)">建蔽率</span>、<span class="hidden-text" onclick="reveal(this)">容積率</span>、<span class="hidden-text" onclick="reveal(this)">建築物の高さ</span>、<span class="hidden-text" onclick="reveal(this)">斜線制限</span>、<span class="hidden-text" onclick="reveal(this)">日影規制</span>）について、必要な制限を定めることができる
                    </td>
                </tr>`
            ]
        },
        {
            category: "集団規定",
            subcategory: "道路",
            title: "道路の幅員に関する基準",
            headers: `<tr><th style="width: 40%;">原則</th><th style="width: 60%;">例外</th></tr>`,
            rows: [
                `<tr>
                    <td class="col-d">
                        幅員<span class="hidden-text" onclick="reveal(this)">4m以上</span>
                    </td>
                    <td class="col-e">

                        ☆都市計画区域・準都市計画区域の指定や条例の制定等により、集団規定が適用されることとなった時、すでに存在し、現に建築物が立ち並んでいる幅員が4m未満の道で、特定行政庁が指定したもの
                    </td>
                </tr>`
            ]
        },
        {
            category: "集団規定",

            headers: `<tr><th style="width: 40%;">原則</th><th style="width: 60%;">例外</th></tr>`,
            rows: [
                `<tr>
                    <td class="col-d">
                        建築物の敷地は建築基準法上の道路に<span class="hidden-text" onclick="reveal(this)">2m以上</span>接していなければならない

                    <td class="col-e">

    let questions = [];
    let incorrectQuestions = [];
    let currentIndex = 0;
    let correctScore = 0;
    let isReviewMode = false;

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startApp() {
        const selectedMode = document.querySelector('input[name="playMode"]:checked').value;
        
        let freshQuestions = rawQuestions.map(q => ({
            ...q,
            rows: [...q.rows],
            revealedIndices: new Set(),
            autoRevealedIndices: new Set(),
            isJudgedIncorrect: false
        }));

        if (selectedMode === 'random') {
            questions = shuffleArray(freshQuestions);
        } else {
            questions = [...freshQuestions];
        }
        
        incorrectQuestions = [];
        currentIndex = 0;
        correctScore = 0;
        isReviewMode = false;

        renderQuizContainer();
        loadQuestion();
    }

    function renderQuizContainer() {
        document.getElementById('app-container').innerHTML = `
            <div class="header">
                <span class="badge-category" id="category-badge"></span>
                <span class="badge-subcategory" id="subcategory-badge"></span>
                <h2 id="title-text"></h2>
                <div class="score-board"><span id="mode-label">問題</span> <span id="current-num">1</span> / <span id="total-count">17</span> | 正解数: <span id="correct-count">0</span></div>
            </div>
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <div style="padding: 20px; background: #fafafa; border-top: 1px solid #ddd; text-align: center;">
                <div class="button-container" id="action-buttons">
                    <!-- 動的にボタンが挿入されます -->
                </div>
                <div id="overall-result" style="margin-top: 10px; font-weight: bold; font-size: 14px;"></div>
            </div>
        `;
    }

    function loadQuestion() {
        const q = questions[currentIndex];
        document.getElementById('category-badge').textContent = q.category;
        document.getElementById('subcategory-badge').textContent = q.subcategory;
        document.getElementById('title-text').textContent = q.title;
        document.getElementById('table-head').innerHTML = q.headers;
        document.getElementById('current-num').textContent = currentIndex + 1;
        document.getElementById('total-count').textContent = questions.length;
        document.getElementById('correct-count').textContent = correctScore;
        document.getElementById('mode-label').textContent = isReviewMode ? '復習問題' : '問題';
        
        document.getElementById('table-body').innerHTML = q.rows.join('');
        
        const hiddenElements = document.querySelectorAll('#table-body .hidden-text');
        hiddenElements.forEach((el, index) => {
            if (!isReviewMode) {
                if (q.revealedIndices.has(index)) {
                    el.classList.add('revealed');
                }
            } else {
                if (q.revealedIndices.has(index) && !q.autoRevealedIndices.has(index)) {
                    el.classList.add('revealed');
                }
            }

            el.onclick = function() {
                reveal(this, index);
            };
        });

        document.getElementById('overall-result').textContent = '';
        
        // ボタンの構築（1問目は「前の問題へ」を表示しない、または無効化するなど）
        let buttonsHtml = '';
        if (currentIndex > 0) {
            buttonsHtml += `<button class="btn btn-prev" onclick="goToPrevQuestion()">◀ 前の問題へ</button>`;
        }
        buttonsHtml += `<button class="btn btn-next" onclick="checkAndNext()">次の問題へ ➔</button>`;

        const actionContainer = document.getElementById('action-buttons');
        actionContainer.innerHTML = buttonsHtml;
        actionContainer.style.display = 'flex';
    }

    function reveal(element, index) {
        element.classList.toggle('revealed');
        const q = questions[currentIndex];
        if (element.classList.contains('revealed')) {
            q.revealedIndices.add(index);
            q.autoRevealedIndices.delete(index);
            element.classList.remove('auto-revealed');
        } else {
            q.revealedIndices.delete(index);
            q.autoRevealedIndices.delete(index);
            element.classList.remove('auto-revealed');
        }
    }

    function checkAndNext() {
        const currentQ = questions[currentIndex];
        const hiddenElements = document.querySelectorAll('#table-body .hidden-text');
        const resultElem = document.getElementById('overall-result');

        // すでに不正解扱いで答えが全開になっている状態でボタンが押された場合は次の問題へ
        if (currentQ.isJudgedIncorrect) {
            moveToNextQuestion();
            return;
        }

        // すべての黒塗りが開いているかチェック
        let allRevealed = true;
        hiddenElements.forEach(el => {
            if (!el.classList.contains('revealed')) {
                allRevealed = false;
            }
        });

        if (allRevealed) {
            // 正解！
            correctScore++;
            document.getElementById('correct-count').textContent = correctScore;
            resultElem.style.color = '#2ecc71';
            resultElem.textContent = '正解！次の問題に進みます...';
            
            document.getElementById('action-buttons').style.display = 'none';
            setTimeout(moveToNextQuestion, 800);
        } else {
            // 不正解（開いていないところがある）
            resultElem.style.color = '#e74c3c';
            resultElem.textContent = 'すべて開いていないため「不正解」となります。答えを確認して、もう一度「次の問題へ」を押してください。';
            
            // まだ開いていないところをすべて自動で開く
            hiddenElements.forEach((el, index) => {
                if (!el.classList.contains('revealed')) {
                    el.classList.add('revealed', 'auto-revealed');
                    currentQ.revealedIndices.add(index);
                    currentQ.autoRevealedIndices.add(index);
                }
            });

            if (!incorrectQuestions.includes(currentQ)) {
                incorrectQuestions.push(currentQ);
            }

            currentQ.isJudgedIncorrect = true;
        }
    }

    function goToPrevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function moveToNextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            loadQuestion();
        } else {
            if (!isReviewMode && incorrectQuestions.length > 0) {
                document.getElementById('app-container').innerHTML = `
                    <div class="header" style="justify-content: center;">
                        <h2>お疲れ様でした！一通り終了しました 🎉</h2>
                    </div>
                    <div style="padding: 40px; text-align: center;">
                        <p style="font-size: 18px; margin-bottom: 10px;">正解数: <strong>${correctScore} / ${rawQuestions.length}</strong></p>
                        <p style="font-size: 16px; color: #e74c3c; margin-bottom: 20px;">間違えた問題（${incorrectQuestions.length}問）の復習を行います！</p>
                        <button class="btn btn-correct" onclick="startReviewMode()">間違えた問題を復習する</button>
                    </div>
                `;
            } else {
                document.getElementById('app-container').innerHTML = `
                    <div class="header" style="justify-content: center;">
                        <h2>お疲れ様でした！すべての学習が完了しました 🎉</h2>
                    </div>
                    <div style="padding: 40px; text-align: center;">
                        <p style="font-size: 18px; margin-bottom: 20px;">お見事です！バッチリマスターできましたね！</p>
                        <button class="btn btn-correct" onclick="location.reload()">最初に戻る</button>
                    </div>
                `;
            }
        }
    }

    function startReviewMode() {
        renderQuizContainer();
        questions = shuffleArray(incorrectQuestions).map(q => ({
            ...q,
            revealedIndices: new Set(),
            autoRevealedIndices: new Set(),
            isJudgedIncorrect: false
        }));
        incorrectQuestions = [];
        currentIndex = 0;
        isReviewMode = true;
        loadQuestion();
    }
</script>
